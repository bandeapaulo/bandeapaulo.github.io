    document.body.append(wrap);
    const close = () => { wrap.remove(); render(); };
    wrap.querySelector("#gcancel").onclick = close;
    wrap.querySelector("#gdel")?.addEventListener("click", () => { LS.del("bap-ghtoken"); toast("Clé retirée."); close(); });
    wrap.querySelector("#gkForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const v = wrap.querySelector("#f-gtok").value.trim();
      if (!v) return close();
      try {
        const r = await fetch(`${GH_API}repos/${gh.owner}/${gh.repo}`, { headers: { Authorization: "Bearer " + v, Accept: "application/vnd.github+json" } });
        if (!r.ok) { toast(r.status === 401 ? "Cette clé est refusée par GitHub : vérifiez le copier-coller." : "Cette clé n’a pas accès au dépôt « " + gh.repo + " » : revoyez l’étape 3.", 9000); return; }
        const j = await r.json();
        if (j.permissions && !j.permissions.push) { toast("Cette clé peut lire mais pas écrire : revoyez l’étape 4 (Contents : Read and write).", 9000); return; }
      } catch { toast("Impossible de vérifier la clé (pas de réseau ?). Elle est enregistrée quand même.", 6000); }
      LS.set("bap-ghtoken", v); toast("Clé enregistrée ✓ Les validations seront mises en ligne automatiquement.", 6000); close();
    });
  }
  // Les tablettes vérifient régulièrement s’il y a une nouvelle version en ligne.
  async function checkUpdate() {
    if (!S.data || S.dirty || publishing || document.querySelector(".sheet-wrap") || document.visibilityState !== "visible") return;
    try {
      const txt = await (await fetch("songs.json?v=" + Date.now(), { cache: "no-store" })).text();
      if (txt && txt !== S.serverText && txt.trim().startsWith("{")) { JSON.parse(txt); await load(); }
    } catch {}
  }
  setInterval(checkUpdate, 60000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") setTimeout(checkUpdate, 800); });

  function markDirty() { S.dirty = true; render(); }

  function renderSaveBar() {
    document.querySelector(".savebar")?.remove();
    const admin = isAdmin();
    const nPend = admin ? 0 : pendingList().length;
    const nPub = admin && S.localOnly ? changedSongs().length : 0;
    if (!S.dirty && !nPend && !nPub) { app.style.paddingBottom = ""; return; }
    const bar = document.createElement("div");
    bar.className = "savebar";
    if (S.dirty) {
      bar.innerHTML = admin ? `<span>Modifications pas encore gardées.</span>
        <button class="btn" id="undo">Annuler les modifications</button>
        <button class="btn primary" id="save">Garder ces modifications</button>`
      : `<span>Modifications pas encore envoyées.</span>
        <button class="btn" id="undo">Annuler les modifications</button>
        <button class="btn primary" id="save">Envoyer à Alexis pour validation</button>`;
    } else if (admin) {
      bar.innerHTML = `<span><b>${nPub}</b> morceau${nPub > 1 ? "x" : ""} modifié${nPub > 1 ? "s" : ""} à mettre en ligne pour tout le monde.</span>
        <button class="btn" id="undoAll">Tout annuler</button>
        <button class="btn primary" id="pub">Mettre en ligne</button>`;
    } else {
      bar.innerHTML = `<span>⏳ En attente de validation par Alexis : ${esc(pendingList().map((p) => p.code || p.title).join(", "))}</span>
        <button class="btn" id="cancelPend">Retirer mes propositions</button>`;
    }
    document.body.append(bar);
    app.style.paddingBottom = bar.offsetHeight + "px";
    const s = current(); if (s && document.getElementById("stage")) drawGrid(s);
    layoutLyrics();
    bar.querySelector("#undo")?.addEventListener("click", () => { restoreBase(); render(); });
    bar.querySelector("#save")?.addEventListener("click", save);
    bar.querySelector("#pub")?.addEventListener("click", publishZip);
    bar.querySelector("#undoAll")?.addEventListener("click", () => { if (!confirm("Annuler toutes les modifications pas encore mises en ligne ?")) return; LS.del("bap-local"); restoreBase(); render(); });
    bar.querySelector("#cancelPend")?.addEventListener("click", () => { if (!confirm("Retirer vos propositions et revenir aux grilles officielles ?")) return; LS.set("bap-sent", []); restoreBase(); render(); });
  }

  function keepLocal() {
    LS.set("bap-local", { base: S.serverText, data: S.data });
    S.dirty = false; S.localOnly = true; render();
  }

  function save() {
    if (isAdmin()) { keepLocal(); if (netToken()) publishZip(); else toast("Gardé ✓ Touchez « Mettre en ligne » pour l’envoyer à tout le monde."); }
    else sendProposal();
  }

  function exportData() {
    try {
      const blob = new Blob([JSON.stringify(S.data, null, 1)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "songs.json";
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast("Fichier songs.json enregistré dans vos téléchargements.");
    } catch { toast("L’export n’a pas fonctionné sur cet appareil."); }
  }

  // keep the screen awake while a grid is shown
  let wake = null;
  // ---------- mode concert ----------
  // Alexis (chef) ouvre un morceau : il est annoncé sur un canal ntfy ; les tablettes qui « suivent »
  // ouvrent automatiquement la grille (musicien·ne·s) ou les paroles (chanteur·euse·s).
  const CONCERT_TOPIC = NTFY_TOPIC + "-concert";
  const concertRole = () => { const r = LS.get("bap-concert", null); return r === "chef" || r === "suit" ? r : null; };
  const CC = { es: null, ok: false, sent: null, last: null };
  function openConcert() {
    const role = concertRole(), admin = isAdmin();
    const wrap = document.createElement("div");
    wrap.className = "sheet-wrap";
    wrap.innerHTML = `<div class="sheet info concert" role="dialog" aria-modal="true" aria-labelledby="cc-t">
      <h3 id="cc-t">🎤 Mode concert</h3>
      <p class="hint">Le chanteur choisit les morceaux : dès qu’il en ouvre un, il s’affiche tout seul sur les tablettes qui suivent le concert (la grille pour les musicien·ne·s, les paroles pour les chanteur·euse·s). Il faut une connexion internet (wifi ou partage de connexion d’un téléphone).</p>
      <div class="roles cc">
        ${admin ? `<button class="rolebtn${role === "chef" ? " on" : ""}" data-cc="chef"><b>Je dirige le concert</b><small>Chaque morceau que j’ouvre est envoyé aux autres</small></button>` : ""}
        <button class="rolebtn${role === "suit" ? " on" : ""}" data-cc="suit"><b>Je suis le concert</b><small>Ma tablette affiche le morceau choisi par Alexis (${S.nav.mode === "paroles" ? "paroles" : "grille"})</small></button>
      </div>
      ${admin ? "" : `<p class="hint">Diriger le concert est réservé à l’appareil d’Alexis (Espace responsable).</p>`}
      <div class="acts"><div>${role ? '<button type="button" class="btn danger" id="ccoff">Quitter le mode concert</button>' : ""}</div><div><button type="button" class="btn" id="ccclose">Fermer</button></div></div>
    </div>`;
    document.body.append(wrap);
    const close = () => { wrap.remove(); render(); };
    wrap.querySelector("#ccclose").onclick = close;
    wrap.addEventListener("click", (e) => { if (e.target === wrap) close(); });
    wrap.querySelector("#ccoff")?.addEventListener("click", () => { LS.set("bap-concert", null); concertConnect(); toast("Mode concert terminé."); close(); });
    wrap.querySelectorAll("[data-cc]").forEach((b) => b.onclick = () => {
      LS.set("bap-concert", b.dataset.cc); CC.sent = null; concertConnect();
      toast(b.dataset.cc === "chef" ? "Vous dirigez : ouvrez un morceau, il part sur les tablettes." : "Vous suivez le concert : votre tablette changera de morceau toute seule.", 4500);
      close();
    });
  }
  function concertGo(id) {
    const t = songs().find((x) => x.id === id);
    if (!t) return;
    CC.last = id;
    const cur = current();
    if (cur && cur.id === id) return;
    if (S.editing || document.querySelector(".sheet-wrap") || S.dirty) { toast(`🎤 Alexis a lancé « ${t.title} » (terminez votre modification puis ouvrez-le)`, 6000); return; }
    S.entered = true;
    location.hash = linkFor(t, S.nav.mode === "paroles" ? "paroles" : "grilles");
  }
  async function concertCatchUp() {
    try {
      const r = await fetch(`${NTFY_URL}${CONCERT_TOPIC}/json?poll=1&since=30m`, { cache: "no-store" });
      const lines = (await r.text()).trim().split("\n").filter(Boolean).map((l) => { try { return JSON.parse(l); } catch { return null; } }).filter((m) => m && m.event === "message");
      const m = lines[lines.length - 1];
      if (m && m.message && m.message !== CC.last) concertGo(m.message.trim());
    } catch {}
  }
  function concertConnect() {
    if (CC.es) { CC.es.close(); CC.es = null; }
    CC.ok = false;
    if (concertRole() !== "suit" || typeof EventSource === "undefined") { updatePill(); return; }
    const es = new EventSource(`${NTFY_URL}${CONCERT_TOPIC}/sse`);
    CC.es = es;
    es.onopen = () => { CC.ok = true; updatePill(); concertCatchUp(); };
    es.onerror = () => { CC.ok = false; updatePill(); };
    es.onmessage = (e) => { try { const m = JSON.parse(e.data); if (m.event === "message" && m.message) concertGo(m.message.trim()); } catch {} };
    updatePill();
  }
  async function concertSend(s) {
    if (CC.sent === s.id) return;
    CC.sent = s.id; CC.ok = false; updatePill();
    try {
      const r = await fetch(NTFY_URL, { method: "POST", body: JSON.stringify({ topic: CONCERT_TOPIC, message: s.id, title: `${s.code || ""} ${s.title}`.trim(), priority: 1 }), headers: { "Content-Type": "application/json" } });
      CC.ok = r.ok; if (!r.ok) CC.sent = null;
    } catch { CC.ok = false; CC.sent = null; toast("Concert : pas de connexion, le morceau n’a pas été envoyé. Réessayez en le rouvrant.", 5000); }
    updatePill();
  }
  function updatePill() {
    const p = document.getElementById("ccpill"); if (!p) return;
    const role = concertRole();
    p.className = "ccpill " + (CC.ok ? "ok" : "wait");
    p.setAttribute("aria-label", "Mode concert"); p.innerHTML = `🎤 <span class="lab">${role === "chef" ? (CC.ok ? "Envoyé aux musiciens" : "Envoi…") : (CC.ok ? "Concert : connecté" : "Concert : connexion…")}</span><i></i>`;
  }
  function concertAfterRender(s) {
    const role = concertRole();
    if (!role) return;
    const bar = app.querySelector(".song > .bar") || app.querySelector(".gbar") || app.querySelector(".home");
    if (bar && !document.getElementById("ccpill")) {
      const p = document.createElement("button"); p.id = "ccpill"; p.type = "button"; p.onclick = openConcert;
      if (bar.classList.contains("home")) bar.prepend(p); else { const h = bar.querySelector("#home, #togroups"); h ? h.after(p) : bar.prepend(p); }
      updatePill();
    }
    if (role === "chef" && s) concertSend(s);
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && concertRole() === "suit") { if (!CC.es || CC.es.readyState === 2) concertConnect(); else concertCatchUp(); } });
  setTimeout(concertConnect, 0);

  // ---------- nouvelle version : prévenir toutes les tablettes tout de suite ----------
  // Après chaque mise en ligne, l'appli d'Alexis envoie un signal ; les tablettes ouvertes vont chercher
  // la nouvelle version sans attendre (et sans recharger la page).
  const UPD_TOPIC = NTFY_TOPIC + "-maj";
  let burstT = null;
  function burstCheck() {
    clearInterval(burstT);
    const before = S.serverText; let n = 0;
    checkUpdate();
    burstT = setInterval(() => { if (S.serverText !== before || ++n > 24) { clearInterval(burstT); return; } checkUpdate(); }, 8000);
  }
  function announceUpdate() {
    fetch(NTFY_URL, { method: "POST", body: JSON.stringify({ topic: UPD_TOPIC, message: "maj", priority: 1 }), headers: { "Content-Type": "application/json" } }).catch(() => {});
  }
  function updConnect() {
    if (typeof EventSource === "undefined") return;
    try {
      const es = new EventSource(`${NTFY_URL}${UPD_TOPIC}/sse`);
      es.onmessage = (e) => { try { const m = JSON.parse(e.data); if (m.event === "message") burstCheck(); } catch {} };
    } catch {}
  }
  setTimeout(updConnect, 0);

  async function requestWake() { try { if (!wake && navigator.wakeLock) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener?.("release", () => { wake = null; }); } } catch { wake = null; } }
  function releaseWake() { try { wake?.release(); } catch {} wake = null; }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && current()) requestWake(); });

  load();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
