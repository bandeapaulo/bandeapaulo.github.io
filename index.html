/* --- en-tête des morceaux plus discret : la place va aux grilles --- */
.song { gap: 5px; padding-block: 6px 8px; }
.song > .bar { gap: 6px; }
.song > .bar .btn, .song > .bar .seg button, .song > .bar .transpo button { min-height: 38px; }
.song > .bar .btn { font-size: .92rem; padding: 0 11px; }
.song > .bar .transpo .key b { font-size: 1rem; }
.song > .bar .transpo .key small { font-size: .68rem; }
.song .head > div { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 12px; }
.song .head .crumb { display: none; }
.song .head h2 { font-size: clamp(1.25rem, 2.3vw, 1.75rem); line-height: 1.15; }
.song .head .cred { font-size: clamp(.8rem, 1.1vw, .95rem); margin-top: 0; }
.song .head .meter { font-size: clamp(.95rem, 1.4vw, 1.15rem); }
.song .top { gap: 4px 14px; }
.song .struct, .song .top .struct { padding: 3px 10px; gap: 4px 8px; font-size: clamp(.9rem, 1.3vw, 1.1rem); border-radius: 10px; }
.song .struct .lbl { font-size: .68rem; }
.song .struct .chip, .song .top .struct .chip { font-size: clamp(1rem, 1.5vw, 1.25rem); min-height: 32px; padding: 0 10px; border-radius: 7px; }
.song .struct .sep { font-size: 1.1em; }
.song .notes .note { font-size: clamp(.78rem, 1.05vw, .88rem); }
.song .notes .more { font-size: .8rem; }
.song .top .head { flex-direction: row; flex-wrap: wrap; align-items: baseline; justify-content: flex-start; column-gap: 14px; }
.song .notes { flex-direction: row; flex-wrap: wrap; align-items: baseline; column-gap: 10px; }
.song .notes .note { flex: 1 1 60%; min-width: 0; }
.song .notes .note.warn, .song .notes.open .note { flex-basis: 100%; }
.song .notes .more { align-self: baseline; flex: none; }
.song:not(.editing) .notes:not(.open) .note:not(.warn) ~ .note:not(.warn) { display: none; }
@media (max-width: 1000px) { .song > .bar [data-fs] .lab, .song > .bar #home .lab { display: none; } }
@media (min-width: 1000px) {
  .song .top .head { max-width: 50%; }
  .song .top .struct { flex: 0 1 auto; margin-left: auto; }
}

/* --- téléphone : en-tête compact pour laisser la place à la grille --- */
@media (max-width: 600px) {
  .song { gap: 5px; padding-block: 6px 6px; }
  .song > .bar { flex-wrap: nowrap; gap: 3px; }
  .song > .bar .transpo { flex: none; }
  .song > .bar .btn { min-width: 32px; padding: 0 4px; }
  .song > .bar .btn, .song > .bar .seg button, .song > .bar .transpo button { min-height: 38px; min-width: 38px; padding: 0 8px; }
  .song > .bar .seg[aria-label="Altérations"], .song > .bar .spacer { display: none; }
  .song > .bar .btn { min-width: 36px; padding: 0 6px; }
  .song > .bar .transpo button { min-width: 30px; padding: 0; font-size: 1.2rem; }
  .song > .bar .transpo .key { min-width: 3.4em; padding: 0 3px; white-space: nowrap; }
  .song > .bar .transpo .key b { font-size: .95rem; }
  .song > .bar .transpo .key small { display: none; }
  .song > .bar .seg.gv button { padding: 0 8px; min-width: 0; font-size: .9rem; }
  .song > .bar .seg.gv button[aria-pressed="true"] { display: none; }
  .song > .bar .seg.og button[aria-pressed="true"] { display: none; }
  .song > .bar .seg.og button { padding: 0 6px; min-width: 32px; }
  .song > .bar .seg.gv .lab { display: none; }
  .song > .bar .seg.gv button { font-size: 1.15rem; min-width: 32px; padding: 0 6px; }
  .song > .bar .seg { flex: none; }
  .song > .bar .transpo .key { min-width: 2.9em; }
  .head h2 { font-size: 1.35rem; }
  .head .cred, .head .crumb { display: none; }
  .head .meter { font-size: 1rem; }
  .top { gap: 4px; }
  .song .struct, .song .top .struct { padding: 3px 8px; gap: 3px 6px; font-size: .85rem; border-radius: 9px; }
  .song .struct .lbl { display: none; }
  .song .struct .chip, .song .top .struct .chip { font-size: .95rem; min-height: 26px; padding: 0 7px; border-radius: 6px; }
  .song .notes .note { font-size: .78rem; }
  .notes.open .note { display: block; }
  .lpager, #gpager { min-height: 40px; }
  .lpager .btn { min-height: 38px; }
}

<style>
/* Layout: one song = one screen; the chord grid is sized by script to fill what the header leaves. */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --ink: #141a26;
  --muted: #5b6577;
  --line: #262e3d;
  --hair: #d5dae3;
  --accent: #2148c9;
  --accent-ink: #ffffff;
  --title: #1d6a3a;
  --warn: #b3202e;
  --tint: #e8edfb;
  --edit: #f3a712;
  --font-chord: "Barlow Semi Condensed", "Avenir Next Condensed", "Roboto Condensed", sans-serif-condensed, "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-ui: "Barlow", "Helvetica Neue", Arial, sans-serif;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#app { min-height: 100%; display: flex; flex-direction: column; padding-inline: 16px; box-sizing: border-box; }

/* ---------- home ---------- */
.home { max-width: 760px; width: 100%; margin: 0 auto; padding-block: 28px 40px; display: flex; flex-direction: column; gap: 22px; }
.home h1 { font-family: var(--font-chord); font-style: italic; font-weight: 700; font-size: clamp(2rem, 6vw, 3rem); color: var(--title); margin: 0; line-height: 1; text-wrap: balance; }
.home .sub { color: var(--muted); margin: 6px 0 0; }
.list { display: flex; flex-direction: column; gap: 8px; }
.song-link { display: grid; box-shadow: 0 1px 0 var(--hair); grid-template-columns: 3.4em 1fr auto; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 16px 18px; min-height: 64px; }
.song-link:hover { border-color: var(--accent); }
.song-link .n { font-variant-numeric: tabular-nums; color: var(--accent); font-family: var(--font-chord); font-weight: 700; font-style: italic; font-size: 1.35rem; }
.song-link .t small { display: block; font-family: var(--font-ui); font-style: normal; font-weight: 500; font-size: .8rem; color: var(--muted); }
.search { width: 100%; box-sizing: border-box; font: inherit; font-size: 1.1rem; padding: 12px 14px; border: 1.5px solid var(--hair); border-radius: 10px; background: var(--surface); color: var(--ink); min-height: 48px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { border: 1.5px solid var(--hair); background: var(--surface); border-radius: 999px; min-height: 44px; padding: 0 16px; font-weight: 600; color: var(--ink); }
.tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tabs button small { font-weight: 500; opacity: .75; margin-left: 4px; font-variant-numeric: tabular-nums; }
.tabs.sub button { min-height: 38px; font-size: .95rem; }
.letter { font-family: var(--font-chord); font-weight: 700; font-style: italic; color: var(--muted); font-size: 1.1rem; margin: 10px 0 0 4px; }
.nav-wrap { display: flex; flex-direction: column; gap: 10px; }
.crumb { color: var(--muted); font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.code { color: var(--accent); margin-right: .35em; }
.song-link .t { font-family: var(--font-chord); font-weight: 700; font-style: italic; font-size: 1.45rem; min-width: 0; }
.song-link .m { color: var(--accent); font-weight: 600; font-size: .95rem; text-align: right; white-space: nowrap; }
.song-link .m small { display: block; color: var(--muted); font-weight: 500; }
.help { color: var(--muted); font-size: .92rem; line-height: 1.5; max-width: 62ch; }
.help b { color: var(--ink); font-weight: 600; }

/* ---------- song view ---------- */
.song { flex: 1; display: flex; flex-direction: column; min-height: 0; padding-block: 10px 12px; gap: 8px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bar .spacer { flex: 1; }
.btn { border: 1px solid var(--hair); background: var(--surface); border-radius: 9px; min-height: 44px; min-width: 44px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.on { background: var(--edit); border-color: var(--edit); color: #1b1300; }
.btn:disabled { opacity: .4; cursor: default; }
.transpo { display: inline-flex; align-items: stretch; border: 1px solid var(--hair); border-radius: 9px; background: var(--surface); overflow: hidden; }
.transpo button { border: 0; background: transparent; min-width: 46px; min-height: 44px; font-size: 1.4rem; font-weight: 600; }
.transpo .key { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 10px; min-width: 7.5em; border-inline: 1px solid var(--hair); line-height: 1.1; }
.transpo .key b { font-family: var(--font-chord); font-size: 1.15rem; font-style: italic; }
.transpo .key small { color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; min-height: 44px; min-width: 42px; font-size: 1.05rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--tint); color: var(--accent); }

.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 4px 16px; }
.head h2 { margin: 0; font-family: var(--font-chord); font-weight: 700; font-style: italic; color: var(--title); font-size: clamp(1.6rem, 4.2vw, 2.6rem); line-height: 1; text-wrap: balance; }
.head .cred { color: var(--muted); font-size: .85rem; font-style: italic; margin-top: 3px; }
.head .meter { font-family: var(--font-chord); font-style: italic; font-weight: 700; color: var(--accent); font-size: clamp(1.2rem, 3vw, 1.7rem); white-space: nowrap; }
.struct { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 1rem; }
.struct .lbl { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.struct .grp { display: inline-flex; align-items: center; gap: 5px; font-style: italic; }
.struct .sep { color: var(--muted); }
.chip { border: 0; background: var(--accent); color: var(--accent-ink); font-family: var(--font-chord); font-weight: 700; font-style: italic; font-size: 1.05rem; border-radius: 6px; padding: 2px 10px; min-height: 30px; }
.notes { display: flex; flex-direction: column; gap: 2px; }
.note { color: var(--accent); font-style: italic; font-size: .95rem; }
.note.warn { color: var(--warn); font-weight: 600; }

.stage { flex: 1; min-height: 160px; position: relative; }
.cols { position: absolute; inset: 0; display: flex; justify-content: center; }
.col { display: flex; flex-direction: column; }
.sec { display: flex; }
.sec.flash .blocks { animation: flash 1s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 6px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.sec .name { font-family: var(--font-chord); font-weight: 700; font-style: italic; color: var(--accent); line-height: 1; padding-top: .25em; }
.blocks { display: flex; flex-direction: column; }
.row { display: flex; }
.cell { position: relative; border: 1.5px solid var(--line); margin: 0 -1.5px -1.5px 0; display: flex; align-items: center; justify-content: center; background: var(--surface); font-family: var(--font-chord); font-weight: 700; font-style: italic; color: var(--ink); padding: 0; box-sizing: border-box; }
.editing .cell { cursor: pointer; }
.editing .cell:hover { background: var(--tint); }
.cell.blank { border-color: transparent; background: transparent; }
.cell.sel { background: var(--tint); box-shadow: inset 0 0 0 3px var(--edit); }
.ch { display: inline-flex; align-items: center; line-height: 1; white-space: nowrap; }
.ch .mods { display: inline-flex; flex-direction: column; justify-content: space-between; font-size: .5em; margin-left: .06em; align-self: stretch; padding-block: .02em .0em; }
.ch .mods sup, .ch .mods sub { vertical-align: baseline; line-height: 1; font-size: 1em; }
.ch .mods sub { margin-top: auto; }
.rep { color: var(--muted); font-weight: 600; font-size: .62em; }
.split .ln { position: absolute; inset: 0; width: 100%; height: 100%; }
.split .ln line { stroke: var(--line); stroke-width: 1.2; }
.split .a { position: absolute; left: 7%; top: 6%; font-size: .74em; }
.split .b { position: absolute; right: 7%; bottom: 6%; font-size: .74em; }
.split .b3 { position: absolute; left: 48%; bottom: 4%; transform: translateX(-50%); font-size: .58em; }
.split .q1 { position: absolute; left: 5%; top: 50%; transform: translateY(-50%); font-size: .55em; }
.split .q2 { position: absolute; left: 50%; top: 4%; transform: translateX(-50%); font-size: .55em; }
.split .q3 { position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%); font-size: .55em; }
.split .q4 { position: absolute; right: 5%; top: 50%; transform: translateY(-50%); font-size: .55em; }
.stop { font-weight: 700; color: var(--muted); letter-spacing: -.05em; }
.split .c3 { position: absolute; right: 5%; top: 50%; transform: translateY(-50%); font-size: .58em; }

/* ---------- save bar, sheet, toast ---------- */
.savebar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 2px solid var(--edit); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; z-index: 20; }
.savebar span { flex: 1; min-width: 12em; color: var(--muted); }
.sheet-wrap { position: fixed; inset: 0; background: rgb(0 0 0 / .35); display: flex; align-items: flex-end; justify-content: center; z-index: 30; }
.sheet { max-height: 100vh; max-height: 100dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; background: var(--surface); width: 100%; max-width: 640px; border-radius: 14px 14px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; }
.sheet h3 { margin: 0; font-size: 1rem; color: var(--muted); font-weight: 600; }
.sheet .inrow { display: flex; gap: 10px; align-items: center; }
.sheet input { flex: 1; min-width: 0; font-family: var(--font-chord); font-style: italic; font-weight: 700; font-size: 1.8rem; padding: 6px 12px; border: 1.5px solid var(--hair); border-radius: 9px; background: var(--bg); color: var(--ink); }
.sheet .prev { width: 110px; height: 64px; flex: none; }
.sheet .err { color: var(--warn); font-size: .9rem; min-height: 1.2em; margin: -4px 0 0; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button { border: 1px solid var(--hair); background: var(--bg); border-radius: 8px; min-height: 42px; min-width: 52px; padding: 0 10px; font-family: var(--font-chord); font-style: italic; font-weight: 700; font-size: 1.15rem; }
.seg.wide { flex-wrap: wrap; }
.seg.wide button { padding: 0 12px; }
.ced-wrap { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.ced { position: relative; width: min(100%, 300px); aspect-ratio: 3 / 2; border: 2px solid var(--line); border-radius: 4px; background: var(--surface); }
.ced svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.ced svg line { stroke: var(--line); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.ced.flat { display: flex; align-items: center; justify-content: center; }
.ced-msg { color: var(--muted); font-weight: 600; }
.ced input.z { position: absolute; width: 34%; min-width: 72px; font-size: 1.25rem; padding: 4px 6px; text-align: center; background: var(--bg); border: 1.5px dashed var(--hair); }
.ced input.z.on { border: 2px solid var(--edit); background: var(--tint); }
.ced.m1 input.c { left: 50%; top: 50%; transform: translate(-50%, -50%); width: 60%; font-size: 1.8rem; }
.ced input.tl { left: 4%; top: 6%; }
.ced input.br { right: 4%; bottom: 6%; }
.ced.m3 input.bm { left: 30%; bottom: 4%; transform: translateX(-50%); width: 30%; }
.ced input.rm { right: 3%; top: 50%; transform: translateY(-50%); width: 28%; }
.ced.m4 input.lm { left: 3%; top: 50%; transform: translateY(-50%); width: 28%; }
.ced.m4 input.tm { left: 50%; top: 4%; transform: translateX(-50%); width: 30%; }
.ced.m4 input.bm { left: 50%; bottom: 4%; transform: translateX(-50%); width: 30%; }
.ced-side { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ced-side .prev { width: 120px; height: 80px; }
.sheet.info { max-height: 92vh; overflow-y: auto; }
.sheet > * { flex-shrink: 0; }
.sheet.info input, .sheet.info textarea { flex: none; }
.sheet.info label { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; font-weight: 600; color: var(--muted); }
.sheet.info label .hint { font-weight: 400; font-size: .8rem; }
.sheet.info input, .sheet.info textarea { font-family: var(--font-ui); font-style: normal; font-weight: 500; font-size: 1.05rem; padding: 8px 10px; border: 1.5px solid var(--hair); border-radius: 9px; background: var(--bg); color: var(--ink); }
.sheet.info textarea { resize: vertical; }
.sheet.info .frow { display: flex; gap: 10px; flex-wrap: wrap; }
.sheet.info .frow label { flex: 1; min-width: 140px; }
.sheet.info .lbl { font-size: .9rem; font-weight: 600; color: var(--muted); }
.secrow { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.secrow input { flex: 1; min-width: 0; }
.quick[hidden] { display: none !important; }
.cpick { margin-top: 10px; }
.cpick[hidden], .cp-body[hidden] { display: none !important; }
.cp-notes { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.cp-lab { font-weight: 600; color: var(--muted); font-size: .9rem; margin-right: 2px; }
.cp-notes button { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-width: 50px; min-height: 48px; border: 1.5px solid var(--hair); border-radius: 10px; background: var(--surface); font-family: var(--font-chord); font-style: italic; font-weight: 700; font-size: 1.2rem; line-height: 1.05; color: var(--ink); }
.cp-notes button small { font-family: var(--font-ui, inherit); font-style: normal; font-weight: 500; font-size: .7rem; color: var(--muted); }
.cp-notes button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cp-notes button[aria-pressed="true"] small { color: inherit; opacity: .85; }
.cp-body { margin-top: 8px; padding: 10px; border: 1.5px solid var(--accent); border-radius: 12px; background: var(--bg); display: grid; gap: 8px; }
.cp-acc { justify-self: start; }
.cp-acc button { font-family: var(--font-chord); font-style: italic; font-weight: 700; font-size: 1.1rem; min-width: 56px; }
.cp-fam { display: grid; grid-template-columns: 5.6em 1fr; align-items: center; gap: 8px; }
.cp-fam > span { font-size: .8rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.cp-fam > div { display: flex; flex-wrap: wrap; gap: 6px; }
.cp-fam button { border: 1px solid var(--hair); background: var(--surface); border-radius: 8px; min-height: 44px; min-width: 56px; padding: 0 10px; font-family: var(--font-chord); font-style: italic; font-weight: 700; font-size: 1.15rem; color: var(--ink); }
@media (max-width: 600px) { .cp-fam { grid-template-columns: 1fr; gap: 4px; } }
.sheet .hint { color: var(--muted); font-size: .85rem; margin: 0; }
.sheet .acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }
.sheet .acts div { display: flex; gap: 8px; flex-wrap: wrap; }
.btn.danger { color: var(--warn); }
.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 9px; z-index: 40; max-width: calc(100% - 32px); box-sizing: border-box; font-weight: 500; }
.poem { white-space: pre-wrap; font-size: clamp(1.1rem, 2.3vw, 1.45rem); line-height: 1.55; max-width: 68ch; padding-bottom: 32px; color: var(--ink); }
.empty { margin: auto; color: var(--muted); text-align: center; padding: 40px 0; }
@media (prefers-reduced-motion: reduce) { .sec.flash .blocks { animation: none; } }

<div id="app"><p class="empty">Chargement des grilles…</p></div>

<script>
(() => {
  // ---------- music helpers ----------
  const NAT = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const SHARP = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  const FLAT  = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
  const FR = { C: "Do", D: "Ré", E: "Mi", F: "Fa", G: "Sol", A: "La", B: "Si" };
  const RE = /^([A-G])([b#]?)(.*)$/;

  const mod = (n) => ((n % 12) + 12) % 12;
  function trNote(root, acc, off, spell) {
    const i = mod(NAT[root] + (acc === "b" ? -1 : acc === "#" ? 1 : 0) + off);
    return (spell === "b" ? FLAT : SHARP)[i];
  }
  function trSimple(ch, off, spell) {
    if (!ch || ch === "%" || off === 0 && !spell) return ch;
    const m = RE.exec(ch);
    if (!m) return ch;
    return trNote(m[1], m[2], off, spell) + m[3];
  }
  function trChord(ch, off, spell) {
    if (!ch || ch === "%") return ch;
    return ch.split("/").map((p) => trSimple(p, off, spell)).join("/");
  }
  const FLAT_MAJ = ["F","Bb","Eb","Ab","Db","Gb"];
  const FLAT_MIN = ["D","G","C","F","Bb","Eb"];
  function autoSpell(key, off) {
    const m = RE.exec(key); if (!m) return "#";
    const minor = m[3].startsWith("m");
    const t = trNote(m[1], m[2], off, "b");
    const ts = trNote(m[1], m[2], off, "#");
    if ((minor ? FLAT_MIN : FLAT_MAJ).includes(t)) return "b";
    return ts.length === 1 && t.length === 1 ? (minor ? "b" : "#") : "#";
  }
  function keyLabel(key) {
    const m = RE.exec(key); if (!m) return key;
    const acc = m[2] === "b" ? "♭" : m[2] === "#" ? "♯" : "";
    return FR[m[1]] + acc + (m[3].startsWith("m") ? " min." : "");
  }
  const VALID = /^$|^%$|^[A-G][b#]?[^\s/]*(\/([A-G][b#]?[^\s/]*|_|=)){0,3}$/;

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function chordHTML(ch) {
    if (ch === "%") return '<span class="rep">%</span>';
    const m = RE.exec(ch || "");
    if (!m) return `<span class="ch">${esc(ch || "")}</span>`;
    const acc = m[2] === "b" ? "♭" : m[2] === "#" ? "♯" : "";
    const suf = m[3];
    if (!acc && !suf) return `<span class="ch">${m[1]}</span>`;
    return `<span class="ch">${m[1]}<span class="mods"><sup>${acc || "&nbsp;"}</sup><sub>${esc(suf) || "&nbsp;"}</sub></span></span>`;
  }
  function cellInner(ch) {
    if (ch && ch.split("/").length === 4) {
      // 4 temps en croix : 1 à gauche, 2 en haut, 3 en bas, 4 à droite ; "_" = l'accord continue, "=" = arrêt
      const q = ch.split("/"), res = [];
      q.forEach((x, i) => { res[i] = x === "_" ? (i ? res[i - 1] : "") : x; });
      const ln = (a, b, x2, y2) => res[a] !== res[b] ? `<line x1="50" y1="50" x2="${x2}" y2="${y2}" vector-effect="non-scaling-stroke"/>` : "";
      const lab = (x, cls) => x === "_" || !x ? "" : `<span class="${cls}">${x === "=" ? '<span class="stop">=</span>' : chordHTML(x)}</span>`;
      return `<svg class="ln" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${ln(0, 1, 6, 6)}${ln(1, 3, 94, 6)}${ln(0, 2, 6, 94)}${ln(2, 3, 94, 94)}</svg>${lab(q[0], "q1")}${lab(q[1], "q2")}${lab(q[2], "q3")}${lab(q[3], "q4")}`;
    }
    if (ch && ch.split("/").length === 3) {
      // 3 accords : 1-2 en haut à gauche, 3 en bas, 4 à droite (comme sur les fiches)
      const [a, b, c] = ch.split("/");
      return `<svg class="ln" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="6" y1="94" x2="94" y2="6" vector-effect="non-scaling-stroke"/><line x1="50" y1="50" x2="94" y2="94" vector-effect="non-scaling-stroke"/></svg><span class="a">${chordHTML(a)}</span><span class="b3">${chordHTML(b)}</span><span class="c3">${chordHTML(c)}</span>`;
    }
    if (ch && ch.includes("/")) {
      const [a, b] = ch.split("/");
      return `<svg class="ln" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="6" y1="94" x2="94" y2="6" vector-effect="non-scaling-stroke"/></svg><span class="a">${chordHTML(a)}</span><span class="b">${chordHTML(b)}</span>`;
    }

  }

  // ---------- storage (per tablet conveniences) ----------

  };

  // ---------- state ----------
  const S = {
    serverText: "", data: null, dirty: false, readOnly: false, localOnly: false,

    editing: false, sel: null, offsets: LS.get("bap-offsets", {}), spells: LS.get("bap-spells", {}),
  };
  const app = document.getElementById("app");
  const songs = () => S.data.songs;
  const groups = () => S.data.groups || [];
  const codeKey = (c) => { const m = /^(\d+)\s*([A-Za-zÀ-ÿ]?)/.exec(c || ""); return m ? [m[2].toUpperCase(), +m[1]] : ["~", 0]; };
  const byCode = (a, b) => { const x = codeKey(a.code), y = codeKey(b.code); return x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : x[1] - y[1] || a.title.localeCompare(b.title, "fr"); };
  const inFolder = (g, f) => songs().filter((s) => s.group === g && (f ? s.folder === f : true)).sort(byCode);
  const siblings = (s) => inFolder(s.group, s.folder);

  const navList = (s) => (view() === "paroles" ? siblings(s).filter((x) => canLyr(x) || x.text) : siblings(s));

  let toastT;

  // ---------- mot de passe et chiffrement ----------
  // songs.json est chiffré (AES-GCM, clé tirée du mot de passe par PBKDF2). Chaque appareil garde la clé
  // et redemande le mot de passe toutes les 10 ouvertures de l'appli.
  const OPENS_MAX = 10;
  const normPw = (p) => p.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const b64e = (buf) => { const b = new Uint8Array(buf); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
  const b64d = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const isEnv = (o) => o && o.enc === 1 && o.data && o.salt && o.iv;
  async function deriveKey(pw, salt, iter) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(normPw(pw)), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64d(salt), iterations: iter }, base, 256));
  }
  async function decryptEnv(env, raw) {
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(env.iv) }, key, b64d(env.data)));
  }
  async function sealText(plain) {
    // même sel que la version en ligne (les autres appareils gardent leur clé), nouvel IV à chaque fois
    const env = S.serverEnv, k = LS.get("bap-key", null);
    if (!env || !k || k.salt !== env.salt) return plain;
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await crypto.subtle.importKey("raw", b64d(k.k), "AES-GCM", false, ["encrypt"]);
    const data = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(plain));
    return JSON.stringify({ enc: 1, v: 1, alg: "AES-GCM", kdf: "PBKDF2-SHA256", iter: env.iter, salt: env.salt, iv: b64e(iv), data: b64e(data) });
  }
  let booted = false;
  async function unlock(text) {
    let env = null;
    try { const o = JSON.parse(text); if (isEnv(o)) env = o; } catch {}
    S.serverEnv = env;
    if (!env) return text;
    if (!booted) { booted = true; LS.set("bap-opens", LS.get("bap-opens", 0) + 1); }
    const k = LS.get("bap-key", null);
    if (k && k.salt === env.salt && LS.get("bap-opens", 0) <= OPENS_MAX) {
      try { return await decryptEnv(env, b64d(k.k)); } catch {}
    }
    LS.del("bap-key");
    return askPassword(env);
  }
  function askPassword(env) {
    try { releaseWake(); } catch {}
    return new Promise((resolve) => {
      app.innerHTML = `<form class="welcome lock" id="lockForm" autocomplete="off">
        <img class="logo small" src="logo.png" alt="La Bande à Paulo" width="480" height="480">
        <h1>Gérard et la Bande à Paulo</h1>
        <label class="lockl" for="pw">Mot de passe de la Bande à Paulo</label>
        <div class="lockrow"><input id="pw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"><button type="button" class="btn" id="pweye" aria-label="Afficher le mot de passe">👁</button></div>
        <p class="lockerr" id="pwerr" role="alert"></p>
        <button class="btn primary go" type="submit" id="pwgo">Entrer</button>
        <p class="help">Le mot de passe est redemandé toutes les ${OPENS_MAX} ouvertures de l’appli.</p>
      </form>`;
      const f = document.getElementById("lockForm"), inp = document.getElementById("pw"), err = document.getElementById("pwerr");
      document.getElementById("pweye").onclick = () => { inp.type = inp.type === "password" ? "text" : "password"; inp.focus(); };
      setTimeout(() => inp.focus(), 100);
      f.addEventListener("submit", async (e) => {
        e.preventDefault();
        const pw = inp.value; if (!pw.trim()) return;
        const go = document.getElementById("pwgo"); go.disabled = true; err.textContent = "Vérification…";
        try {
          const raw = await deriveKey(pw, env.salt, env.iter || 150000);
          const plain = await decryptEnv(env, raw);
          LS.set("bap-key", { salt: env.salt, k: b64e(raw) }); LS.set("bap-opens", 1);
          resolve(plain);
        } catch { err.textContent = "Mot de passe incorrect. Réessayez."; go.disabled = false; inp.select(); }
      });
    });
  }

  // ---------- load ----------
  async function load() {
    let text;
    try {
      const r = await fetch("songs.json?v=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      text = await r.text();
    } catch {
      text = document.getElementById("fallback-data")?.textContent || "";
      if (!text) { app.innerHTML = '<p class="empty">Les grilles n’ont pas pu être chargées. Rechargez la page.</p>'; return; }
    }
    let plain;
    try { plain = await unlock(text); } catch { return; }
    S.serverText = text; S.plainText = plain;
    S.data = JSON.parse(plain);
    S.serverMap = Object.fromEntries(JSON.parse(plain).songs.map((s) => [s.id, s]));
    const local = LS.get("bap-local", null);
    if (local && local.base === text) {
      S.data = local.data; S.localOnly = true;
    } else if (local) {
      LS.del("bap-local");
      if (isAdmin()) setTimeout(() => toast("Nouvelle version en ligne reçue ✓", 4000), 400);
    }
    if (!isAdmin()) {
      const done = [], keep = [];
      pendingList().forEach((p) => {
        const srv = S.serverMap[p.id];
        if (srv && canon(srv) === canon(p.song)) done.push(p);
        else if (Date.now() - p.at < 60 * 864e5) keep.push(p);
      });
      LS.set("bap-sent", keep);
      restoreBase();
      if (done.length) setTimeout(() => toast(`✓ Alexis a validé votre modification : ${done.map((p) => (p.code || "") + " " + p.title).join(", ")}`, 8000), 500);
      setTimeout(flushOutbox, 1500);
    }
    try {
      const pending = sessionStorage.getItem("bap-pending");
      if (pending) { sessionStorage.removeItem("bap-pending"); S.data = JSON.parse(pending); S.dirty = true; }
    } catch {}
    render();
  }

  // ---------- render ----------
  function render() {

    if (s) { S.nav.page = "group"; S.nav.cahier = codeKey(s.code)[0]; if (s.group) S.nav.group = s.group; if (s.folder) S.nav.folder = s.folder; LS.set("bap-nav", S.nav); }
    if (/^#valider=/.test(location.hash)) return renderValidation(location.hash.slice(9));

    if (!S.entered && !s) { if (S.nav.page === "group" || S.nav.page === "groups") S.nav.page = "role"; return renderWelcome(); }
    if (!s) renderHome(); else if (view() === "paroles" && canLyr(s) && !s.text) renderLyrics(s); else renderSong(s);
    if (s && pendingIds().has(s.id) && !S.dirty) {

      b.textContent = "⏳ Votre modification de ce morceau est en attente de validation par Alexis. Vous la voyez déjà sur cette tablette.";
      app.querySelector(".bar")?.after(b);
      if (document.getElementById("stage")) drawGrid(s);

    renderSaveBar();
    concertAfterRender(s);
  }

  function songRow(s, withPlace) {

  function renderList() {

  // ---------- classements : par cahier, de A à Z, par style ----------
  const sortMode = () => (["alpha", "style"].includes(S.nav.sort) ? S.nav.sort : "cahier");
  const ARTS = /^(?:(?:les|le|la|une|un|des|du|aux|au)\s+|l['’]\s*)/i;
  const sortTitle = (t) => fold((t || "").trim()).replace(ARTS, "").replace(/^[^a-z0-9]+/, "");
  const byTitle = (a, b) => sortTitle(a.title).localeCompare(sortTitle(b.title), "fr") || byCode(a, b);
  // Le style vient directement de la fiche : s'il est modifié dans la grille, le classement suit.
  function styleKeys(s) {
    const raw = (s.style || "").replace(/\(.*?\)/g, "").replace(/\?/g, "").trim();
    if (!raw) return ["Style non indiqué"];
    return [...new Set(raw.split(/\s*\/\s*/).map((x) => x.trim()).filter(Boolean).map((x) => x.charAt(0).toUpperCase() + x.slice(1).toLowerCase()))];
  }
  function renderAlpha(box) {
    const { list } = folderSongs();
    const items = list.slice().sort(byTitle);
    if (!items.length) { box.innerHTML = `<p class="help">Aucun morceau dans ce dossier pour l’instant.</p>`; return; }
    let last = null, html = "";
    items.forEach((s) => {
      const L = (sortTitle(s.title).charAt(0) || "#").toUpperCase();
      if (L !== last) { html += `<h3 class="lethead" id="let-${esc(L)}">${esc(L)}</h3>`; last = L; }
      html += songRow(s, false);
    });
    const letters = [...new Set(items.map((s) => (sortTitle(s.title).charAt(0) || "#").toUpperCase()))];
    box.innerHTML = `<div class="letjump" role="group" aria-label="Aller à la lettre">${letters.map((L) => `<button data-let="${esc(L)}">${esc(L)}</button>`).join("")}</div>` + html;
    box.querySelectorAll("[data-let]").forEach((b) => b.onclick = () => document.getElementById("let-" + b.dataset.let)?.scrollIntoView({ behavior: "smooth", block: "start" }));
    box.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => { location.hash = b.dataset.go; }));
  }
  function renderStyles(box) {
    const { g, f, list } = folderSongs();
    const by = {};
    list.forEach((s) => styleKeys(s).forEach((k) => (by[k] = by[k] || []).push(s)));
    const keys = Object.keys(by).sort((a, b) => (a === "Style non indiqué") - (b === "Style non indiqué") || a.localeCompare(b, "fr"));
    const sel = S.nav.style && by[S.nav.style] ? S.nav.style : null;
    if (!sel) {
      box.innerHTML = keys.length ? `<div class="cahiers styles">${keys.map((k) => `<button class="cah sty" data-sty="${esc(k)}"><span class="cl">Style</span><b>${esc(k)}</b><small>${by[k].length} morceau${by[k].length > 1 ? "x" : ""}</small></button>`).join("")}</div>`
        : `<p class="help">Aucun morceau dans ce dossier pour l’instant.</p>`;
      box.querySelectorAll("[data-sty]").forEach((b) => b.onclick = () => { S.nav.style = b.dataset.sty; LS.set("bap-nav", S.nav); renderHome(); window.scrollTo(0, 0); });
      return;
    }
    const k = keys.indexOf(sel);
    box.innerHTML = `<div class="cahbar">
        <button class="btn cahall" id="cahback"><span class="ico" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Tous les styles</button>
        <h2 class="cahtitle">${esc(sel)}<small>${esc([g && g.name, f, homeMode() === "paroles" ? "Paroles" : "Grilles"].filter(Boolean).join(" › "))}</small></h2>
        <span class="spacer"></span>
        <button class="btn" id="cahprev" ${k > 0 ? "" : "disabled"} aria-label="Style précédent">‹</button>
        <button class="btn" id="cahnext" ${k < keys.length - 1 ? "" : "disabled"} aria-label="Style suivant">›</button>
      </div>` + by[sel].slice().sort(byTitle).map((s) => songRow(s, false)).join("");
    const setS = (v) => { S.nav.style = v; LS.set("bap-nav", S.nav); renderHome(); };
    box.querySelector("#cahback").onclick = () => setS(null);
    if (k > 0) box.querySelector("#cahprev").onclick = () => setS(keys[k - 1]);
    if (k < keys.length - 1) box.querySelector("#cahnext").onclick = () => setS(keys[k + 1]);
    box.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => { location.hash = b.dataset.go; }));
  }
  function visFolders(g) {
    if (homeMode() === "grilles") return g.folders;
    return g.folders.filter((f) => songs().some((s) => s.group === g.name && s.folder === f && hasLyr(s)));
  }
  function renderHome() {
    S.editing = false; S.sel = null; releaseWake();
    if (S.nav.page === "role") return renderRole();
    if (S.nav.page !== "group") return renderGroups();
    const g = groups().find((x) => x.name === S.nav.group) || groups()[0];
    const mode = homeMode();
    const fl = g ? visFolders(g) : [];
    const fsel = fl.includes(S.nav.folder) ? S.nav.folder : fl[0];
    const count = (gn, fn) => songs().filter((s) => s.group === gn && (!fn || s.folder === fn) && (mode === "grilles" || hasLyr(s))).length;
    app.innerHTML = `<div class="home">
      <div class="gbar"><button class="btn cahall" id="togroups"><span class="ico" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Groupes</button>
        <div class="gtitle"><h1>${esc(g.name)}</h1><p class="sub">${mode === "paroles" ? "Paroles" : "Grilles d’accords"} · ${count(g.name)} morceaux</p></div></div>
      <input class="search" id="q" type="search" placeholder="Rechercher un titre ou un code (ex. 2P)" value="${esc(S.q)}" autocomplete="off" aria-label="Rechercher un morceau">
      <div class="nav-wrap" id="navwrap" ${S.q.trim() ? "hidden" : ""}>
        ${fl.length > 1 ? `<div class="tabs sub" role="group" aria-label="Dossiers">${fl.map((f) => `<button data-folder="${esc(f)}" aria-pressed="${f === fsel}">${esc(f)}<small>${count(g.name, f)}</small></button>`).join("")}</div>` : ""}
        <div class="sortbar" role="group" aria-label="Classement"><span>Classer&nbsp;:</span><div class="seg">${[["cahier", "Par cahier"], ["alpha", "De A à Z"], ["style", "Par style"]].map(([v, l]) => `<button data-sort="${v}" aria-pressed="${sortMode() === v}">${l}</button>`).join("")}</div></div>
      </div>
      <nav class="list" id="list" aria-label="Morceaux"></nav>
    </div>`;
    const saveNav = () => LS.set("bap-nav", S.nav);
    document.getElementById("togroups").onclick = () => { S.nav.page = "groups"; S.nav.cahier = null; S.q = ""; saveNav(); render(); window.scrollTo(0, 0); };
    app.querySelectorAll("[data-folder]").forEach((b) => b.onclick = () => { S.nav.folder = b.dataset.folder; S.nav.cahier = null; S.nav.style = null; saveNav(); renderHome(); });
    app.querySelectorAll("[data-sort]").forEach((b) => b.onclick = () => { S.nav.sort = b.dataset.sort; S.nav.cahier = null; S.nav.style = null; saveNav(); renderHome(); });
    const q = document.getElementById("q");
    q.addEventListener("input", () => { S.q = q.value; document.getElementById("navwrap").hidden = !!S.q.trim(); renderList(); });
    renderList();
  }

  function renderPoem(s) {
    requestWake();
    const sib = navList(s), i = sib.indexOf(s);
    const prev = sib[i - 1], next = sib[i + 1];
    if (s.group) { S.nav.group = s.group; if (s.folder) S.nav.folder = s.folder; LS.set("bap-nav", S.nav); }
    app.innerHTML = `<div class="song">
      <div class="bar">
        <button class="btn" id="home" aria-label="Liste des morceaux">← <span class="lab">Morceaux</span></button>
        <span class="spacer"></span>
        ${fsBtn()}
      </div>
      <div class="head"><div><div class="crumb">${esc([s.group, s.folder].filter(Boolean).join(" › "))}</div><h2>${s.code ? `<span class="code">${esc(s.code)}</span>` : ""}${esc(s.title)}</h2><div class="cred">${esc(s.credits || "")}${s.year ? " · " + esc(s.year) : ""}</div></div></div>
      ${(s.notes || []).length ? `<div class="notes">${s.notes.map((n) => `<div class="note">${esc(n)}</div>`).join("")}</div>` : ""}
      <div class="lpage" id="lyr"><div class="lyrics poemtext">${fmtLyrics(s.text)}</div><button class="ltap l" id="ltapl" aria-label="Page précédente" tabindex="-1"></button><button class="ltap r" id="ltapr" aria-label="Page suivante" tabindex="-1"></button></div>
      <div class="lpager" id="lpager"><button class="btn" id="lpprev" aria-label="Page précédente">‹</button><span id="lpinfo" aria-live="polite"></span><button class="btn" id="lpnext" aria-label="Page suivante">›</button></div>
    </div>`;
    document.getElementById("home").onclick = () => { location.hash = ""; };
    if (renderPoem.last !== s.id) { renderPoem.last = s.id; S.lpi = 0; }
    S.lpLast = false;
    ["lpprev", "ltapl"].forEach((id) => { document.getElementById(id).onclick = () => step(-1); });
    ["lpnext", "ltapr"].forEach((id) => { document.getElementById(id).onclick = () => step(1); });
    requestAnimationFrame(layoutLyrics);
    document.addEventListener("keydown", onKey);
  }

  // ---------- paroles (chanteur) ----------
  const DIR = /^(\(.*\)|instrument|refrain|ritournelle|pont\b|final\b|intro\b|en intro|coda|\d+(er|e|ème)\s+couplet|couplet\b|break|point d.orgue|\d+\s+mesures?\b|monter d.un ton|ralentir|version|première version|deuxième version|pas de refrain|silence|passage siffl|là, éventuellement|un (refrain|couplet) en instrumental|chœurs?$)/i;
  function fmtLyrics(text) {
    const norm = (x) => fold(x).replace(/^\d+\s*[-–]?\s*/, "").replace(/[^a-z0-9]+/g, " ").trim();
    const stz = String(text || "").split(/\n\s*\n/).map((x) => x.split("\n").filter((l) => l.trim().length));
    const seen = {};
    stz.forEach((lines) => { const k = norm(lines.join(" ")); if (lines.length > 1) seen[k] = (seen[k] || 0) + 1; });
    return stz.filter((l) => l.length).map((lines) => {
      const allDir = lines.every((l) => DIR.test(l.trim()));
      const rep = !allDir && lines.length > 1 && seen[norm(lines.join(" "))] > 1;
      const body = lines.map((l) => {
        l = l.trim();
        if (DIR.test(l)) return `<span class="dir">${esc(l)}</span>`;
        let m = /^-\s*(\d+)\s*-$/.exec(l);
        if (m) return `<span class="vn solo">${m[1]}</span>`;
        m = /^(\d{1,2})\s*[-–.]?\s+(?!(fois|mesures?)\b)(\S.*)$/.exec(l);
        if (m) return `<span class="ln"><span class="vn">${m[1]}</span>${esc(m[3])}</span>`;
        m = /^(Chœurs?)\s+(.*)$/.exec(l);
        if (m) return `<span class="ln"><span class="dir">${m[1]}</span> ${esc(m[2])}</span>`;
        return `<span class="ln">${esc(l)}</span>`;
      }).join("");
      return `<p class="stz${allDir ? " dirs" : ""}${rep ? " refr" : ""}">${body}</p>`;
    }).join("");
  }
  const LSZ = [0.8, 0.9, 1, 1.1, 1.25, 1.4, 1.6, 1.8];
  function renderLyrics(s) {
    requestWake();
    if (renderLyrics.last !== s.id) { renderLyrics.last = s.id; window.scrollTo(0, 0); S.lpi = 0; }
    S.lpLast = false;
    const sib = navList(s), i = sib.indexOf(s);
    const prev = sib[i - 1], next = sib[i + 1];
    if (s.group) { S.nav.group = s.group; if (s.folder) S.nav.folder = s.folder; LS.set("bap-nav", S.nav); }
    let zi = LS.get("bap-lsize", 2); zi = Math.max(0, Math.min(LSZ.length - 1, zi));
    const struct = (s.structure || []).map((g) => `<span class="grp">${g.pre ? esc(g.pre) : ""}${g.parts.split(" ").map((p) => `<span class="chip">${esc(p)}</span>`).join("")}${g.post ? esc(g.post) : ""}</span>`).join('<span class="sep">›</span>');
    const focus = !!s.lyrics && LS.get("bap-lfocus", false) === true;
    app.innerHTML = `<div class="song lyr${S.editing ? " editing" : ""}${focus ? " focus" : ""}">
      <div class="bar">
        <button class="btn" id="home" aria-label="Liste des morceaux">← <span class="lab">Morceaux</span></button>
        <div class="seg gv" role="group" aria-label="Grille ou paroles"><button id="togrid" aria-pressed="false">Grille</button><button aria-pressed="true">Paroles</button></div>
        <div class="seg" role="group" aria-label="Taille du texte"><button id="zm" aria-label="Texte plus petit" ${zi === 0 ? "disabled" : ""}>A−</button><button id="zp" aria-label="Texte plus grand" ${zi === LSZ.length - 1 ? "disabled" : ""}>A+</button></div>
        <span class="spacer"></span>
        ${s.lyrics ? `<button class="btn lfocus" id="lfocus" aria-label="Paroles seules" title="Ne voir que les paroles">⤢ <span class="lab">Paroles seules</span></button>` : ""}
        ${fsBtn()}
        <button class="btn" id="edlyr">✎ <span class="lab">Modifier</span></button>
      </div>
      <div class="top">
        <div class="head"><div><div class="crumb">${esc([s.group, s.folder, "Paroles"].filter(Boolean).join(" › "))}</div><h2>${s.code ? `<span class="code">${esc(s.code)}</span>` : ""}${esc(s.title)}</h2><div class="cred">${esc(s.credits || "")}${s.year ? " · " + esc(s.year) : ""}</div></div></div>
        ${struct ? `<div class="struct small"><span class="lbl">Structure</span>${struct}</div>` : ""}
      </div>
      ${s.lyrics ? `<div class="lpage" id="lyr"><div class="lyrics" style="--ls:${LSZ[zi]}">${fmtLyrics(s.lyrics)}</div><button class="ltap l" id="ltapl" aria-label="Page précédente" tabindex="-1"></button><button class="ltap r" id="ltapr" aria-label="Page suivante" tabindex="-1"></button></div>
      <div class="lpager" id="lpager"><button class="btn" id="lpprev" aria-label="Page précédente">‹</button><span id="lpinfo" aria-live="polite"></span><button class="btn" id="lpnext" aria-label="Page suivante">›</button>${focus ? `<button class="btn lfexit" id="lfexit" aria-label="Revenir à l’affichage complet" title="Revenir à l’affichage complet">⤡</button>` : ""}</div>` : `<p class="empty">Pas encore de paroles pour ce morceau.<br><button class="btn primary" id="addlyr" style="margin-top:12px">✎ Ajouter les paroles</button></p>`}
    </div>`;
    const $ = (id) => document.getElementById(id);
    $("home").onclick = () => { location.hash = ""; };
    $("togrid").onclick = () => { location.hash = s.id; };
    const zoom = (d) => { LS.set("bap-lsize", Math.max(0, Math.min(LSZ.length - 1, zi + d))); render(); };
    $("zm").onclick = () => zoom(-1);
    $("zp").onclick = () => zoom(1);
    $("edlyr").onclick = () => openLyrics(s);
    const setFocus = (v) => { LS.set("bap-lfocus", v); render(); };
    if ($("lfocus")) $("lfocus").onclick = () => setFocus(true);
    if ($("lfexit")) $("lfexit").onclick = () => setFocus(false);
    if ($("lyr")) {
      $("lpprev").onclick = () => step(-1);
      $("lpnext").onclick = () => step(1);
      $("ltapl").onclick = () => step(-1);
      $("ltapr").onclick = () => step(1);
      let wl = 0;
      $("lyr").addEventListener("wheel", (e) => { e.preventDefault(); const now = Date.now(); if (now - wl < 450 || Math.abs(e.deltaY) < 8) return; wl = now; step(e.deltaY > 0 ? 1 : -1); }, { passive: false });
      requestAnimationFrame(layoutLyrics);
    }
    if ($("addlyr")) $("addlyr").onclick = () => openLyrics(s);
    document.addEventListener("keydown", onKey);
  }
  function openLyrics(s) {
    const wrap = document.createElement("div");
    wrap.className = "sheet-wrap";
    wrap.innerHTML = `<form class="sheet info lyred" role="dialog" aria-modal="true" aria-labelledby="ly-t" id="lyForm">

    </form>`;
    document.body.append(wrap);
    const close = () => wrap.remove();
    wrap.querySelector("#lcancel").onclick = close;
    wrap.addEventListener("click", (e) => { if (e.target === wrap) close(); });
    wrap.querySelector("#lyForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const v = wrap.querySelector("#f-lyr").value.replace(/\r/g, "").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();

      close(); markDirty();

    setTimeout(() => wrap.querySelector("#f-lyr").focus(), 30);
  }

  function renderSong(s) {
    if (s.text && !(s.sections || []).length) return renderPoem(s);
    requestWake();
    const sib = siblings(s), i = sib.indexOf(s);
    const prev = sib[i - 1], next = sib[i + 1];
    if (s.group) { S.nav.group = s.group; if (s.folder) S.nav.folder = s.folder; LS.set("bap-nav", S.nav); }
    const o = offOf(s);
    const keyNow = trChord(s.key, o, spellOf(s) || (o ? autoSpell(s.key, o) : null));
    const pref = S.spells[s.id] || "auto";
    const secNames = s.sections.map((x) => x.name.toLowerCase());
    const struct = s.structure.map((g) => `<span class="grp">${g.pre ? esc(g.pre) : ""}${g.parts.split(" ").map((p) =>
      secNames.includes(p.toLowerCase()) ? `<button class="chip" data-jump="${esc(p)}">${esc(p)}</button>` : `<span class="chip" aria-disabled="true">${esc(p)}</span>`).join("")}${g.post ? esc(g.post) : ""}</span>`).join('<span class="sep">›</span>');

    app.innerHTML = `<div class="song${S.editing ? " editing" : ""}">
      <div class="bar">
        <button class="btn" id="home" aria-label="Liste des morceaux">← <span class="lab">Morceaux</span></button>
        <div class="transpo" role="group" aria-label="Transposition">
          <button id="down" aria-label="Descendre d’un demi-ton">−</button>
          <div class="key"><b>${esc(keyLabel(keyNow))}</b><small>${o === 0 ? "tonalité d’origine" : (o > 0 ? "+" : "") + o + " demi-ton" + (Math.abs(o) > 1 ? "s" : "")}</small></div>
          <button id="up" aria-label="Monter d’un demi-ton">+</button>
        </div>
        <div class="seg" role="group" aria-label="Altérations">
          <button data-sp="auto" aria-pressed="${pref === "auto"}" title="Automatique">A</button>
          <button data-sp="b" aria-pressed="${pref === "b"}" title="Bémols">♭</button>
          <button data-sp="#" aria-pressed="${pref === "#"}" title="Dièses">♯</button>
        </div>
        ${o !== 0 ? `<button class="btn" id="reset">Origine</button>` : ""}
        <span class="spacer"></span>
        <div class="seg og" id="ordergv" role="group" aria-label="Ordre d’affichage" hidden><button data-order="jeu" aria-pressed="false" title="Pages dans l’ordre de la structure">▶ <span class="lab">Ordre de jeu</span></button><button data-order="grille" aria-pressed="false" title="Chaque partie une seule fois">▦ <span class="lab">Grille complète</span></button></div>
        ${canLyr(s) ? `<div class="seg gv" role="group" aria-label="Grille ou paroles"><button aria-pressed="true">Grille</button><button id="tolyr" aria-pressed="false" aria-label="Paroles">♪ <span class="lab">Paroles</span></button></div>` : ""}
        ${fsBtn()}
        <button class="btn${S.editing ? " on" : ""}" id="edit" aria-pressed="${S.editing}">✎ <span class="lab">${S.editing ? "Terminer" : "Modifier"}</span></button>
      </div>
      ${S.editing ? `<div class="editbanner" role="status">
        <div class="eb-txt"><b>Mode modification</b><span>① Touchez une <u>case</u> pour changer l’accord</span><span>② Touchez le <u>titre</u>, les <u>auteurs</u>, le <u>style</u>, la <u>structure</u> ou un <u>nom de partie</u> pour les modifier</span><span>③ Pour <u>ajouter une case</u> : touchez la case voisine puis « + Case avant » ou « + Case après »</span></div>
        <div class="eb-btns"><button class="btn eb-info" id="infos">✎ Infos du morceau</button><button class="btn eb-done" id="done">✓ Terminer</button></div>
      </div>` : ""}
      <div class="top">
      <div class="head">
        <div><div class="crumb">${esc([s.group, s.folder].filter(Boolean).join(" › "))}</div><h2 class="ed">${s.code ? `<span class="code">${esc(s.code)}</span>` : ""}${esc(s.title)}</h2><div class="cred ed">${esc(s.credits) || (S.editing ? "+ ajouter les auteurs" : "")}${s.year ? " · " + esc(s.year) : ""}</div></div>
        ${s.style || s.meter || S.editing ? `<div class="meter ed">${esc([s.style, s.meter].filter(Boolean).join("  ")) || "+ style / mesure"}</div>` : ""}
      </div>
      <div class="struct ed"><span class="lbl">Structure</span>${struct}${S.editing && !s.structure.length ? "<span class=\"addhint\">+ ajouter la structure</span>" : ""}</div>
      </div>
      ${s.notes.length ? `<div class="notes ed" id="notesBox">${s.notes.map((n) => `<div class="note${/^attention/i.test(n) ? " warn" : ""}">${esc(n)}</div>`).join("")}${S.editing ? "" : `<button class="more" id="notesMore" hidden>Lire les remarques en entier</button>`}</div>` : ""}
      ${S.editing && o !== 0 ? `<div class="notes"><div class="note">Vous modifiez la grille transposée. <button class="btn" id="bake" style="min-height:34px">Écrire la grille dans cette tonalité</button></div></div>` : ""}
      <div class="stage" id="stage"><div class="cols" id="cols"></div></div>
      <div class="lpager" id="gpager" hidden><button class="btn" id="gpprev" aria-label="Page précédente">‹</button><span id="gpinfo" aria-live="polite"></span><button class="btn" id="gpnext" aria-label="Page suivante">›</button><button class="btn gpexit" id="gpexit" hidden></button></div>
    </div>`;

    const $ = (id) => document.getElementById(id);
    $("home").onclick = () => { location.hash = ""; };
    $("up").onclick = () => setOff(s, o + 1);

  // Paroles en pages fixes : la pédale tourne les pages, puis passe au morceau suivant.

  // Fit the grid to the free space: 1 or 2 columns, whichever gives bigger cells.
  // Si la grille ne tient pas sur un écran avec des cases lisibles, elle est découpée

  const BG = 0.2, SG = 0.5;
  // Sur une même page, une longue partie peut continuer dans la 2e colonne (jamais sur une autre page).
  function fitGrid(secs, W, H, NC) {
    const labelw = Math.max(34, Math.min(70, W * 0.07));
    const items = [];
    secs.forEach((v) => v.blocks.forEach((blk, bi) => items.push({ v, blk, first: bi === 0 })));
    const height = (its) => its.reduce((h, it, i) => h + (i ? (it.first ? SG : BG) : 0) + it.blk.length, 0);
    const one = height(items);

    const opts = [{ rowh: Math.min(H / one, cw1 * 0.85), ncol: 1, groups: [items], cw: Math.min(cw1, (H / one) * 1.8) }];

        const mx = Math.max(height(items.slice(0, k)), height(items.slice(k)));
        const score = mx + (items[k].first ? 0 : 0.6); // on préfère couper entre deux parties
        if (!best || score < best.score) best = { mx, k, score };

    for (let i = 0; i < views.length; i++) {

      else units.push([views[i]]);
    }

    units.forEach((u) => { if (cur.length && !ok(cur.concat(u))) { pages.push(cur); cur = []; } cur = cur.concat(u); });

  // ---------- ordre de jeu ----------

  // « k fois » est déroulé ; « n fois » forme une boucle : la pédale revient au début de la boucle.
  function playPlan(s) {

    const segs = [];
    for (const [gi, g] of s.structure.entries()) {

      if (!toks.length) continue;

      const st = sis.map((si) => ({ si, g: gi }));
      const bad = toks.filter((x, i) => sis[i] < 0);
      if (bad.length) return { error: "« " + bad.join(" ") + " » n’existe pas dans la grille" };

        if (p.exit != null) { ex.hidden = false; ex.innerHTML = `Sortir de la boucle → ${nameOf(route[p.exit].views[0])}`; ex.onclick = () => { S.ghist.push(S.gpi); S.gpi = p.exit; drawGrid(s); }; }
        else ex.hidden = true;
      } else {
        document.getElementById("gpinfo").innerHTML = `Page <b>${S.gpi + 1}</b> / ${pages.length}${last ? " · ensuite retour page 1" : ""}`;
        if (ex) ex.hidden = true;
      }
    }
    // Sécurité : si quelque chose dépasse encore (police, remarques, barre du bas), on resserre.
    const lim = Math.min(stage.getBoundingClientRect().bottom, innerHeight - (sb ? sb.offsetHeight : 0));
    const ov = Math.max(0, ...[...cols.querySelectorAll(".cell")].map((c) => c.getBoundingClientRect().bottom - lim));
    if (ov > 1 && shrink < 400) return drawGrid(s, shrink + ov + 6);
    if (S.editing) cols.querySelectorAll(".name.ed").forEach((n) => { n.onclick = () => openInfo(s); });
    if (S.editing) cols.querySelectorAll(".cell").forEach((c) => {
      const open = () => openSheet(s, c.dataset.pos.split(",").map(Number));
      c.addEventListener("click", open);
      c.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
    });
  }

  let rz;
  addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { const s = current(); if (s && document.getElementById("stage")) drawGrid(s); layoutLyrics(); }, 80); });
  addEventListener("hashchange", () => { S.editing = false; S.sel = null; render(); });

  // swipe between songs
  let tx = null, ty = null;
  addEventListener("touchstart", (e) => { if (e.touches.length === 1) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; } }, { passive: true });
  addEventListener("touchend", (e) => {
    if (tx == null || S.editing || document.querySelector(".sheet-wrap")) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    const s = current(); if (!s || Math.abs(dx) < 90 || Math.abs(dy) > 60) return;
    step(dx < 0 ? 1 : -1);
  }, { passive: true });

  // ---------- editing ----------
  // ---------- cell editor : 1, 2, 3 or 4 chords per measure ----------
  const ONE = /^[A-G][b#]?[^\s/]*$/;
  const CP_NOTES = [["C", "Do"], ["D", "Ré"], ["E", "Mi"], ["F", "Fa"], ["G", "Sol"], ["A", "La"], ["B", "Si"]];
  const CP_ACC = { C: ["", "#"], D: ["b", "", "#"], E: ["b", ""], F: ["", "#"], G: ["b", "", "#"], A: ["b", "", "#"], B: ["b", ""] };
  const CP_FAM = [
    ["Majeur", ["", "6", "7Maj", "9", "5+", "sus4"]],
    ["Mineur", ["m", "m6", "m7", "m9", "m7b5"]],
    ["Septième", ["7", "13", "7b9", "7b5", "75+", "7sus4"]],
    ["Diminué", ["dim", "7dim", "9dim"]],
  ];
  const LAYOUT = {
    1: [["c", "accord"]],
    2: [["tl", "1er accord"], ["br", "2e accord"]],
    3: [["tl", "temps 1-2"], ["bm", "temps 3"], ["rm", "temps 4"]],
    4: [["lm", "temps 1"], ["tm", "temps 2"], ["bm", "temps 3"], ["rm", "temps 4"]],
  };
  const LINES = {
    1: "",
    2: '<line x1="4" y1="96" x2="96" y2="4"/>',
    3: '<line x1="4" y1="96" x2="96" y2="4"/><line x1="50" y1="50" x2="96" y2="96"/>',
    4: '<line x1="4" y1="4" x2="96" y2="96"/><line x1="4" y1="96" x2="96" y2="4"/>',
  };
  const normOne = (v) => v.trim().replace(/\s+/g, "").replace(/♭/g, "b").replace(/♯/g, "#").replace(/^([a-g])/, (m) => m.toUpperCase());

  function openSheet(s, pos, fresh) {
    S.sel = pos; drawGrid(s);
    const [si, bi, ri, ci] = pos;
    const sec = s.sections[si], row = sec.blocks[bi][ri];
    const o = offOf(s), sp = spellOf(s);
    const raw = row[ci] || "";
    const cur = show(s, raw);
    let mode = raw === "%" ? "rep" : (raw === "" || raw === "~") ? "empty" : Math.min(4, cur.split("/").length);
    if (fresh) mode = 1;
    let vals = (typeof mode === "number" ? cur.split("/") : []).concat(["", "", "", ""]).slice(0, 4);
    let active = 0;
    const used = [...new Set(s.sections.flatMap((x) => x.blocks.flat(2)).flatMap((c) => (c || "").split("/")).filter((c) => c && !["%", "_", "=", "~"].includes(c)).map((c) => trChord(c, o, sp)))];
    const wrap = document.createElement("div");
    wrap.className = "sheet-wrap";
    wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
      <h3 id="sh-t">${esc(sec.name)} · ligne ${ri + 1 + sec.blocks.slice(0, bi).reduce((a, b) => a + b.length, 0)} · mesure ${ci + 1}</h3>
      <div class="seg wide" id="modes" role="group" aria-label="Découpage de la case">
        <button data-m="1">1 accord</button><button data-m="2">2</button><button data-m="3">3</button><button data-m="4">4 (croix)</button><button data-m="rep">%</button><button data-m="empty">Vide</button>
      </div>
      <div class="ced-wrap"><div class="ced" id="ced"></div><div class="ced-side"><div class="cell prev" id="pv"></div><span class="hint">Aperçu</span></div></div>
      <p class="err" id="err"></p>
      <div class="quick" id="quick">${used.map((c) => `<button data-q="${esc(c)}">${chordHTML(c)}</button>`).join("")}<button data-q="_" title="l’accord précédent continue">↦ continue</button><button data-q="=" title="arrêt / break">= arrêt</button></div>
      <div class="cpick" id="cpick"><div class="cp-notes" role="group" aria-label="Tous les accords, par note"><span class="cp-lab">Tous les accords&nbsp;:</span>${CP_NOTES.map(([n, fr]) => `<button data-root="${n}">${n}<small>${fr}</small></button>`).join("")}</div><div class="cp-body" id="cpbody" hidden></div></div>
      <p class="hint">Touchez une zone de la case puis tapez l’accord (ex. <b>Gm</b>, <b>D7</b>, <b>Bb</b>, <b>F#m7</b>) ou choisissez-le dans la liste.</p>
      <div class="acts">
        <div><button class="btn add" id="addBefore">+ Case avant</button><button class="btn add" id="addCell">+ Case après</button><button class="btn danger" id="delCell">− Case</button><button class="btn add" id="addRow">+ Ligne</button><button class="btn danger" id="delRow">− Ligne</button></div>
        <div><button class="btn" id="cancel">Annuler</button><button class="btn primary" id="ok">Valider</button></div>
      </div></div>`;
    document.body.append(wrap);
    const ced = wrap.querySelector("#ced"), pv = wrap.querySelector("#pv"), err = wrap.querySelector("#err");
    const compose = () => {
      if (mode === "rep") return "%";
      if (mode === "empty") return "";
      return vals.slice(0, mode).map((v) => normOne(v)).join("/");
    };
    const valid = () => {
      if (typeof mode !== "number") return true;
      return vals.slice(0, mode).every((v, i) => { v = normOne(v); return ONE.test(v) || (mode > 1 && (v === "_" || v === "=") && !(i === 0 && v === "_")); });
    };
    const preview = () => {
      const v = compose();
      pv.className = "cell prev" + (v.includes("/") ? " split" : "");
      pv.style.fontSize = "30px";
      pv.innerHTML = valid() ? cellInner(v) : "";
      const bad = typeof mode === "number" && vals.slice(0, mode).some((x) => normOne(x) && !ONE.test(normOne(x)) && !(mode > 1 && ["_", "="].includes(normOne(x))));
      err.textContent = bad ? "Un accord commence par une lettre de A à G (ou « _ » / « = » dans une case découpée)." : "";
    };
    const drawCed = () => {
      wrap.querySelectorAll("#modes button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.m === String(mode))));
      wrap.querySelector("#quick").hidden = typeof mode !== "number";
      wrap.querySelector("#cpick").hidden = typeof mode !== "number";
      if (typeof mode !== "number") {
        ced.className = "ced flat";
        ced.innerHTML = `<span class="ced-msg">${mode === "rep" ? "Mesure répétée : %" : "Case vide"}</span>`;
        preview(); return;
      }
      if (active >= mode) active = 0;
      ced.className = "ced m" + mode;
      ced.innerHTML = `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${LINES[mode]}</svg>` +
        LAYOUT[mode].map(([zone, label], i) => `<input class="z ${zone}${i === active ? " on" : ""}" data-i="${i}" value="${esc(vals[i])}" placeholder="${label}" aria-label="${label}" autocomplete="off" autocapitalize="off" spellcheck="false">`).join("");
      ced.querySelectorAll("input").forEach((inp) => {
        inp.addEventListener("focus", () => { setTimeout(() => inp.select(), 0); active = +inp.dataset.i; ced.querySelectorAll("input").forEach((x) => x.classList.toggle("on", x === inp)); });
        inp.addEventListener("input", () => { vals[+inp.dataset.i] = inp.value; preview(); });
        inp.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); const nx = ced.querySelector(`input[data-i="${+inp.dataset.i + 1}"]`); nx ? nx.focus() : wrap.querySelector("#ok").click(); }
          if (e.key === "Escape") close();
        });
      });
      preview();
      setTimeout(() => ced.querySelector(`input[data-i="${active}"]`)?.focus(), 20);
    };
    wrap.querySelectorAll("#modes button").forEach((b) => b.onclick = () => {
      const m = b.dataset.m; const nm = /^\d$/.test(m) ? +m : m;
      if (typeof nm === "number" && typeof mode === "number" && nm < mode) vals = vals.slice(0, nm).concat(["", "", "", ""]).slice(0, 4);
      if (typeof nm === "number" && typeof mode !== "number") vals = ["", "", "", ""];
      mode = nm; active = 0; drawCed();
    });
    const pickQ = (q) => {
      if (typeof mode !== "number") return;
      vals[active] = q;
      const nxt = active + 1 < mode ? active + 1 : active;
      active = nxt; drawCed();
    };
    wrap.querySelectorAll("#quick [data-q]").forEach((b) => b.onclick = () => pickQ(b.dataset.q));
    // Menu de tous les accords : on touche une note, la liste de ses accords se déroule.
    const cpbody = wrap.querySelector("#cpbody");
    let cpRoot = null, cpAcc = "";
    const drawCP = () => {
      wrap.querySelectorAll("[data-root]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.root === cpRoot)));
      if (!cpRoot) { cpbody.hidden = true; return; }
      const accs = CP_ACC[cpRoot];
      if (!accs.includes(cpAcc)) cpAcc = "";
      const R = cpRoot + cpAcc;
      cpbody.hidden = false;
      cpbody.innerHTML = (accs.length > 1 ? `<div class="seg cp-acc" role="group" aria-label="Altération">${accs.map((a) => `<button data-acc="${a}" aria-pressed="${a === cpAcc}">${a === "" ? cpRoot : chordHTML(cpRoot + a)}</button>`).join("")}</div>` : "") +
        CP_FAM.map(([lab, sufs]) => `<div class="cp-fam"><span>${lab}</span><div>${sufs.map((x) => `<button data-q="${esc(R + x)}">${chordHTML(R + x)}</button>`).join("")}</div></div>`).join("");
      cpbody.querySelectorAll("[data-acc]").forEach((b) => b.onclick = () => { cpAcc = b.dataset.acc; drawCP(); });
      cpbody.querySelectorAll("[data-q]").forEach((b) => b.onclick = () => pickQ(b.dataset.q));
    };
    wrap.querySelectorAll("[data-root]").forEach((b) => b.onclick = () => {
      const r = b.dataset.root;
      if (cpRoot === r) { cpRoot = null; } else {
        cpRoot = r;
        const m = /^([A-G])([b#]?)/.exec(normOne(vals[active] || ""));
        cpAcc = m && m[1] === r ? m[2] : "";
      }
      drawCP();
    });
    const close = () => { wrap.remove(); S.sel = null; drawGrid(s); };
    const commit = (mutate) => { mutate(); markDirty(); close(); };
    wrap.addEventListener("click", (e) => { if (e.target === wrap) close(); });
    wrap.querySelector("#cancel").onclick = close;
    wrap.querySelector("#ok").onclick = () => {
      if (!valid()) { preview(); err.textContent = "Remplissez chaque zone de la case (ou choisissez moins d’accords)."; return; }
      const v = compose();
      const back = o === 0 ? v : trChord(v, -o, autoSpell(s.key, 0));
      commit(() => { row[ci] = back; });
    };
    const addAt = (at) => { row.splice(at, 0, ""); S.dirty = true; close(); render(); openSheet(s, [si, bi, ri, at], true); toast("Nouvelle case ajoutée : tapez son ou ses accords."); };
    wrap.querySelector("#addCell").onclick = () => addAt(ci + 1);
    wrap.querySelector("#addBefore").onclick = () => addAt(ci);
    const delCell = wrap.querySelector("#delCell");
    if (row.length <= 1) delCell.disabled = true;
    delCell.onclick = () => commit(() => { row.splice(ci, 1); });
    wrap.querySelector("#addRow").onclick = () => commit(() => { sec.blocks[bi].splice(ri + 1, 0, row.map(() => "%")); });
    const del = wrap.querySelector("#delRow");
    if (sec.blocks.reduce((a, b) => a + b.length, 0) <= 1) del.disabled = true;
    del.onclick = () => commit(() => { sec.blocks[bi].splice(ri, 1); if (!sec.blocks[bi].length) sec.blocks.splice(bi, 1); });
    drawCed();
  }

  // ---------- song info editor ----------
  const STYLES = ["Valse", "Valse lente", "Valse musette", "Java", "Tango", "Swing", "Marche", "Scottish", "Mazurka", "Polka", "Blues", "Ragtime", "Ragtime médium", "Cha cha", "Rumba", "Boléro", "Paso doble", "Fox-trot", "Quick-step", "Slow", "Biguine", "Two-step", "Cajun", "Zydeco", "Contredanse", "Reel", "Gigue", "Bourrée", "Madison", "Séga", "Rock", "Charleston", "Habanera"];
  const METERS = ["2/4", "3/4", "4/4", "6/8", "12/8"];
  function structToText(st) { return (st || []).map((g) => [g.pre, g.parts, g.post].filter(Boolean).join(" ")).join("\n"); }
  function textToStruct(txt, names) {
    const low = names.map((n) => n.toLowerCase());
    return txt.split("\n").map((l) => l.trim()).filter(Boolean).map((line) => {
      const w = line.split(/\s+/);
      const isP = (t) => low.includes(t.toLowerCase());
      const first = w.findIndex(isP);
      if (first < 0) return { pre: line, parts: "", post: "" };
      let last = first; while (last + 1 < w.length && isP(w[last + 1])) last++;
      return { pre: w.slice(0, first).join(" "), parts: w.slice(first, last + 1).map((t) => names[low.indexOf(t.toLowerCase())]).join(" "), post: w.slice(last + 1).join(" ") };
    });
  }
  function openInfo(s) {
    const meterKnown = !s.meter || METERS.includes(s.meter);
    const wrap = document.createElement("div");
    wrap.className = "sheet-wrap";
    wrap.innerHTML = `<form class="sheet info" role="dialog" aria-modal="true" aria-labelledby="in-t" id="infoForm">
      <h3 id="in-t">Informations du morceau ${s.code ? "· " + esc(s.code) : ""}</h3>
      <label>Titre<input id="f-title" value="${esc(s.title || "")}" required></label>
      <label>Auteurs<input id="f-credits" value="${esc(s.credits || "")}" placeholder="Paroles de … · Musique de …"></label>
      <div class="frow">
        <label>Année<input id="f-year" value="${esc(s.year || "")}" inputmode="numeric" placeholder="ex. 1936"></label>
        <label>Tonalité<input id="f-key" value="${esc(s.key || "")}" placeholder="ex. Gm, Bb, D"></label>
      </div>
      <label>Style<input id="f-style" list="styles" value="${esc(s.style || "")}" placeholder="Valse, Java, Tango…"></label>
      <datalist id="styles">${[...new Set(STYLES.concat(songs().flatMap((x) => (x.style || "").split(/\s*\/\s*/)).filter(Boolean)))].sort((a, b) => a.localeCompare(b, "fr")).map((x) => `<option value="${esc(x)}">`).join("")}</datalist>
      <div class="lbl">Mesure</div>
      <div class="seg wide" id="meters">${METERS.map((m) => `<button type="button" data-me="${m}" aria-pressed="${s.meter === m}">${m}</button>`).join("")}<button type="button" data-me="" aria-pressed="${!s.meter}">aucune</button></div>
      <input id="f-meter" value="${esc(s.meter || "")}" placeholder="autre (ex. 3/4 · 4/4)" ${meterKnown ? "" : ""}>
      <label>Structure <span class="hint">une ligne par enchaînement, ex. « n fois A B Rit » ; les noms de parties (${s.sections.map((x) => esc(x.name)).join(", ")}) deviennent des boutons</span>
        <textarea id="f-struct" rows="3">${esc(structToText(s.structure))}</textarea></label>
      <label>Remarques <span class="hint">une par ligne ; commencer par « Attention » pour l’afficher en rouge</span>
        <textarea id="f-notes" rows="3">${esc((s.notes || []).join("\n"))}</textarea></label>
      <div class="lbl">Parties de la grille</div>
      <div id="secs">${s.sections.map((x, i) => `<div class="secrow"><input data-sec="${i}" value="${esc(x.name)}" aria-label="Nom de la partie"><button type="button" class="btn danger" data-delsec="${i}" ${s.sections.length <= 1 ? "disabled" : ""}>Supprimer</button></div>`).join("")}</div>
      <button type="button" class="btn" id="addSec">+ Ajouter une partie</button>
      <p class="err" id="ierr"></p>
      <div class="acts"><div></div><div><button type="button" class="btn" id="icancel">Annuler</button><button type="submit" class="btn primary">Valider</button></div></div>
    </form>`;
    document.body.append(wrap);
    const $ = (id) => wrap.querySelector("#" + id);
    const secNames = s.sections.map((x) => x.name);
    const delSet = new Set(); let added = 0;
    wrap.querySelectorAll("[data-me]").forEach((b) => b.onclick = () => { $("f-meter").value = b.dataset.me; wrap.querySelectorAll("[data-me]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); });
    $("f-meter").addEventListener("input", () => wrap.querySelectorAll("[data-me]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.me === $("f-meter").value.trim()))));
    wrap.querySelectorAll("[data-delsec]").forEach((b) => b.onclick = () => { const i = +b.dataset.delsec; delSet.add(i); b.closest(".secrow").hidden = true; });
    $("addSec").onclick = () => {
      added++;
      const r = document.createElement("div"); r.className = "secrow";
      r.innerHTML = `<input data-new="1" value="${esc("Partie " + (s.sections.length + added))}" aria-label="Nom de la nouvelle partie"><span class="hint">nouvelle (4 × 4 mesures)</span>`;
      $("secs").append(r); r.querySelector("input").select();
    };
    const close = () => wrap.remove();
    $("icancel").onclick = close;
    wrap.addEventListener("click", (e) => { if (e.target === wrap) close(); });
    $("infoForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const title = $("f-title").value.trim();
      if (!title) { $("ierr").textContent = "Le titre ne peut pas être vide."; return; }
      const key = normOne($("f-key").value);
      if (key && !ONE.test(key)) { $("ierr").textContent = "Tonalité non reconnue (ex. Gm, Bb, D)."; return; }
      const renamed = [...wrap.querySelectorAll("[data-sec]")].map((inp) => ({ i: +inp.dataset.sec, name: inp.value.trim() || secNames[+inp.dataset.sec] }));
      const news = [...wrap.querySelectorAll("[data-new]")].map((inp) => inp.value.trim()).filter(Boolean);
      const kept = renamed.filter((r) => !delSet.has(r.i));
      const allNames = kept.map((r) => r.name).concat(news);
      if (new Set(allNames.map((n) => n.toLowerCase())).size !== allNames.length) { $("ierr").textContent = "Deux parties portent le même nom."; return; }
      // structure text: translate old names to new names before parsing
      let stxt = $("f-struct").value;
      const map = {}; renamed.forEach((r) => { if (r.name !== secNames[r.i]) map[secNames[r.i].toLowerCase()] = r.name; });
      stxt = stxt.split("\n").map((l) => l.split(/(\s+)/).map((t) => map[t.toLowerCase()] || t).join("")).join("\n");
      s.title = title;
      s.credits = $("f-credits").value.trim();
      s.year = $("f-year").value.trim() || null;
      s.style = $("f-style").value.trim() || null;
      s.meter = $("f-meter").value.trim() || null;
      if (key) s.key = key;
      s.sections = kept.map((r) => Object.assign(s.sections[r.i], { name: r.name })).concat(news.map((n) => ({ name: n, blocks: [[["%", "%", "%", "%"], ["%", "%", "%", "%"], ["%", "%", "%", "%"], ["%", "%", "%", "%"]]] })));
      if (!s.sections.length) s.sections = [{ name: "A", blocks: [[["%", "%", "%", "%"]]] }];
      s.structure = textToStruct(stxt, s.sections.map((x) => x.name));
      s.notes = $("f-notes").value.split("\n").map((x) => x.trim()).filter(Boolean);
      close(); markDirty();
      toast("Informations modifiées. Pensez à enregistrer.");
    });
    setTimeout(() => $("f-title").focus(), 30);
  }

  function bake(s) {
    const o = offOf(s); if (!o) return;
    const sp = spellOf(s) || autoSpell(s.key, o);
    s.sections.forEach((sec) => sec.blocks.forEach((b) => b.forEach((r) => r.forEach((c, i) => { r[i] = trChord(c, o, sp); }))));
    s.key = trChord(s.key, o, sp);
    delete S.offsets[s.id]; LS.set("bap-offsets", S.offsets);
    markDirty();
    toast("Grille réécrite dans cette tonalité. Pensez à enregistrer.");
  }

  // ---------- propositions : un musicien modifie → Alexis valide → mise en ligne ----------
  const NTFY_TOPIC = "bandeapaulo-nrsu2g9s43";
  const NTFY_URL = window.BAP_NTFY || "https://ntfy.sh/";
  const isAdmin = () => LS.get("bap-admin", false) === true;
  const myName = () => LS.get("bap-name", "");
  function canon(v) {
    if (Array.isArray(v)) return "[" + v.map(canon).join(",") + "]";
    if (v && typeof v === "object") return "{" + Object.keys(v).sort().filter((k) => v[k] !== undefined).map((k) => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}";
    return JSON.stringify(v === undefined ? null : v);
  }
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const changedSongs = () => songs().filter((s) => canon(s) !== canon(S.serverMap[s.id] || null));
  const pendingList = () => LS.get("bap-sent", []);
  const pendingIds = () => new Set(isAdmin() ? [] : pendingList().map((p) => p.id));
  async function pack(obj) {
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    let out = null, z = "0";
    if (window.CompressionStream) {
      try { out = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer()); z = "1"; } catch { out = null; }
    }
    if (!out) out = bytes;
    let bin = ""; for (let i = 0; i < out.length; i++) bin += String.fromCharCode(out[i]);
